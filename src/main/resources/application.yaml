spring:
  application:
    name: todo

  datasource:
    url: jdbc:postgresql://localhost:5432/todo
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080