spring:
  application:
    name: todo

  datasource:
    url: jdbc:postgresql://localhost:5432/todo
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE